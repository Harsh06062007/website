<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance - Neon Classes</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">

    <style>
        .attendance-page {
            min-height: 100vh;
            padding: 120px 20px 50px;
            background: #f5f7ff;
        }

        .attendance-box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .attendance-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .student-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
        }

        .student-form input,
        .student-form select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .attendance-table th {
            background: #4a00e0;
            color: white;
        }

        .present-btn,
        .absent-btn,
        .delete-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 3px;
        }

        .present-btn {
            background: #28a745;
        }

        .absent-btn {
            background: #dc3545;
        }

        .delete-btn {
            background: #555;
        }

        .present {
            color: #28a745;
            font-weight: bold;
        }

        .absent {
            color: #dc3545;
            font-weight: bold;
        }

        .percentage {
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .student-form {
                grid-template-columns: 1fr;
            }

            .attendance-box {
                padding: 15px;
                overflow-x: auto;
            }

            .attendance-table {
                min-width: 750px;
            }
        }
    </style>
</head>

<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">

        <div class="nav-logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Neon Classes</span>
        </div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link">Home</a>
            </li>

            <li class="nav-item">
                <a href="index.html#about" class="nav-link">About</a>
            </li>

            <li class="nav-item">
                <a href="index.html#courses" class="nav-link">Courses</a>
            </li>

            <li class="nav-item">
                <a href="Attendance.html" class="nav-link">Attendance</a>
            </li>

            <li class="nav-item">
                <a href="index.html#contact" class="nav-link">Contact</a>
            </li>
        </ul>

    </div>
</nav>


<!-- Attendance -->
<section class="attendance-page">

    <div class="attendance-box">

        <h1 class="attendance-title">
            <i class="fas fa-calendar-check"></i>
            Student Attendance
        </h1>

        <!-- Add Student -->
        <div class="student-form">

            <input
                type="text"
                id="studentName"
                placeholder="Enter Student Name"
            >
            <select id="studentClass" required>
        <option value="">Select Class</option>
        <option value="Class 6">Class 6</option>
        <option value="Class 7">Class 7</option>
        <option value="Class 8">Class 8</option>
        <option value="Class 9">Class 9</option>
        <option value="Class 10">Class 10</option>
        <option value="Class 11">Class 11</option>
        <option value="Class 12">Class 12</option>
    </select>

            <input
                type="date"
                id="attendanceDate"
            >

            <button
        type="button"
        class="btn btn-primary"
        onclick="addStudent()">
        Add Student
    </button>

        </div>


        <!-- Attendance Table -->

        <table class="attendance-table">

            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Percentage</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="attendanceList">
            </tbody>

        </table>

    </div>

</section>

<script>
let attendanceData = JSON.parse(localStorage.getItem("neonAttendance")) || [];

function addStudent() {

    let name = document.getElementById("studentName").value.trim();
    let studentClass = document.getElementById("studentClass").value;
    let date = document.getElementById("attendanceDate").value;

    if (name === "") {
        alert("Please enter student name");
        return;
    }
    if (studentClass === "") {
        alert("Please select class");
        return;
    }

    if (date === "") {
        alert("Please select date");
        return;
    }

    let student = {
        id: Date.now(),
        name: name,
        studentClass: studentClass,
        date: date,
        status: "Not Marked"
    };

    attendanceData.push(student);

    localStorage.setItem(
        "neonAttendance",
        JSON.stringify(attendanceData)
    );

    document.getElementById("studentName").value = "";
    document.getElementById("studentClass").value = "";
    document.getElementById("attendanceDate").value = "";

    displayAttendance();
}


function markPresent(id) {

    let student = attendanceData.find(s => s.id === id);

    if (student) {
        student.status = "Present";
    }

    localStorage.setItem(
        "neonAttendance",
        JSON.stringify(attendanceData)
    );

    displayAttendance();
}


function markAbsent(id) {

    let student = attendanceData.find(s => s.id === id);

    if (student) {
        student.status = "Absent";
    }

    localStorage.setItem(
        "neonAttendance",
        JSON.stringify(attendanceData)
    );

    displayAttendance();
}


function deleteStudent(id) {

    attendanceData = attendanceData.filter(
        s => s.id !== id
    );

    localStorage.setItem(
        "neonAttendance",
        JSON.stringify(attendanceData)
    );

    displayAttendance();
}


function getPercentage(name) {

    let records = attendanceData.filter(
        s => s.name.toLowerCase() === name.toLowerCase()
    );

    let total = records.filter(
        s => s.status === "Present" || s.status === "Absent"
    ).length;

    let present = records.filter(
        s => s.status === "Present"
    ).length;

    if (total === 0) {
        return "0%";
    }

    return Math.round((present / total) * 100) + "%";
}


function displayAttendance() {

    let list = document.getElementById("attendanceList");

    list.innerHTML = "";

    attendanceData.forEach(student => {

        let statusClass = "";

        if (student.status === "Present") {
            statusClass = "present";
        }

        if (student.status === "Absent") {
            statusClass = "absent";
        }

        list.innerHTML += `
            <tr>

                <td>${student.name}</td>

                <td>${student.date}</td>

                <td class="${statusClass}">
                    ${student.status}
                </td>

                <td>
                    <button
                        class="present-btn"
                        onclick="markPresent(${student.id})">
                        Present
                    </button>
                </td>

                <td>
                    <button
                        class="absent-btn"
                        onclick="markAbsent(${student.id})">
                        Absent
                    </button>
                </td>

                <td>
                    ${getPercentage(student.name)}
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${student.id})">
                        Delete
                    </button>
                </td>

            </tr>
        `;
    });
}


displayAttendance();
</script>
<script src="Attendance.js"></script>

</body>
</html>
