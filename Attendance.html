<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance - Neon Classes</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet">

    <style>

        .attendance-page {
            min-height: 100vh;
            padding: 120px 20px 50px;
            background: #f5f7ff;
        }

        .attendance-box {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .attendance-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 40px;
        }

        /* FORM */

        .student-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
        }

        .student-form input,
        .student-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        .student-form input:focus,
        .student-form select:focus {
            outline: none;
            border-color: #4a00e0;
        }

        .add-btn {
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 900px;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .attendance-table th {
            background: #4a00e0;
            color: white;
            font-size: 16px;
        }

        .attendance-table tr:hover {
            background: #f8f8ff;
        }

        /* BUTTONS */

        .present-btn,
        .absent-btn,
        .delete-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            margin: 2px;
            font-size: 14px;
        }

        .present-btn {
            background: #28a745;
        }

        .absent-btn {
            background: #dc3545;
        }

        .delete-btn {
            background: #555;
        }

        .present-btn:hover {
            background: #218838;
        }

        .absent-btn:hover {
            background: #c82333;
        }

        .delete-btn:hover {
            background: #333;
        }

        /* STATUS */

        .present {
            color: #28a745;
            font-weight: bold;
        }

        .absent {
            color: #dc3545;
            font-weight: bold;
        }

        .not-marked {
            color: #777;
            font-weight: bold;
        }

        .percentage {
            font-weight: bold;
        }

        /* EMPTY */

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .attendance-page {
                padding: 100px 10px 30px;
            }

            .attendance-box {
                padding: 20px 15px;
            }

            .attendance-title {
                font-size: 30px;
            }

            .student-form {
                grid-template-columns: 1fr;
            }

            .add-btn {
                width: 100%;
            }

        }

    </style>
</head>


<body>

<!-- ================= NAVIGATION ================= -->

<nav class="navbar">

    <div class="nav-container">

        <div class="nav-logo">

            <i class="fas fa-graduation-cap"></i>

            <span>Neon Classes</span>

        </div>


        <ul class="nav-menu">

            <li class="nav-item">
                <a href="index.html" class="nav-link">
                    Home
                </a>
            </li>

            <li class="nav-item">
                <a href="index.html#about" class="nav-link">
                    About
                </a>
            </li>

            <li class="nav-item">
                <a href="index.html#courses" class="nav-link">
                    Courses
                </a>
            </li>

            <li class="nav-item">
                <a href="Attendance.html" class="nav-link">
                    Attendance
                </a>
            </li>

            <li class="nav-item">
                <a href="index.html#contact" class="nav-link">
                    Contact
                </a>
            </li>

        </ul>

    </div>

</nav>


<!-- ================= ATTENDANCE ================= -->

<section class="attendance-page">

    <div class="attendance-box">

        <h1 class="attendance-title">

            <i class="fas fa-calendar-check"></i>

            Student Attendance

        </h1>


        <!-- ================= ADD STUDENT ================= -->

        <div class="student-form">

            <!-- Student Name -->

            <input
                type="text"
                id="studentName"
                placeholder="Enter Student Name"
            >


            <!-- Class -->

            <select id="studentClass">

                <option value="">
                    Select Class
                </option>

                <option value="Class 6">
                    Class 6
                </option>

                <option value="Class 7">
                    Class 7
                </option>

                <option value="Class 8">
                    Class 8
                </option>

                <option value="Class 9">
                    Class 9
                </option>

                <option value="Class 10">
                    Class 10
                </option>

                <option value="Class 11">
                    Class 11
                </option>

                <option value="Class 12">
                    Class 12
                </option>

            </select>


            <!-- Date -->

            <input
                type="date"
                id="attendanceDate"
            >


            <!-- Add Button -->

            <button
                type="button"
                class="add-btn"
                onclick="addStudent()"
            >

                <i class="fas fa-plus"></i>

                Add Student

            </button>

        </div>


        <!-- ================= TABLE ================= -->

        <div class="table-container">

            <table class="attendance-table">

                <thead>

                    <tr>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Present
                        </th>

                        <th>
                            Absent
                        </th>

                        <th>
                            Percentage
                        </th>

                        <th>
                            Delete
                        </th>

                    </tr>

                </thead>


                <tbody id="attendanceList">

                </tbody>

            </table>

        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

let attendanceData =
    JSON.parse(localStorage.getItem("neonAttendance")) || [];



/* ================= ADD STUDENT ================= */

function addStudent() {

    let name =
        document.getElementById("studentName").value.trim();

    let studentClass =
        document.getElementById("studentClass").value;

    let date =
        document.getElementById("attendanceDate").value;


    /* Validation */

    if (name === "") {

        alert("Please enter student name");

        return;

    }


    if (studentClass === "") {

        alert("Please select class");

        return;

    }


    if (date === "") {

        alert("Please select date");

        return;

    }


    /* Create Student */

    let student = {

        id: Date.now(),

        name: name,

        studentClass: studentClass,

        date: date,

        status: "Not Marked"

    };


    /* Add Data */

    attendanceData.push(student);


    /* Save Data */

    saveData();


    /* Clear Form */

    document.getElementById("studentName").value = "";

    document.getElementById("studentClass").value = "";

    document.getElementById("attendanceDate").value = "";


    /* Display */

    displayAttendance();

}



/* ================= PRESENT ================= */

function markPresent(id) {

    let student =
        attendanceData.find(
            s => s.id === id
        );


    if (student) {

        student.status = "Present";

    }


    saveData();

    displayAttendance();

}



/* ================= ABSENT ================= */

function markAbsent(id) {

    let student =
        attendanceData.find(
            s => s.id === id
        );


    if (student) {

        student.status = "Absent";

    }


    saveData();

    displayAttendance();

}



/* ================= DELETE ================= */

function deleteStudent(id) {

    let confirmDelete =
        confirm("Are you sure you want to delete this student?");


    if (!confirmDelete) {

        return;

    }


    attendanceData =
        attendanceData.filter(
            s => s.id !== id
        );


    saveData();

    displayAttendance();

}



/* ================= PERCENTAGE ================= */

function getPercentage(name, studentClass) {

    let records =
        attendanceData.filter(

            s =>
                s.name.toLowerCase() ===
                name.toLowerCase()

                &&

                s.studentClass === studentClass

        );


    let total =
        records.filter(

            s =>
                s.status === "Present"
                ||
                s.status === "Absent"

        ).length;


    let present =
        records.filter(

            s =>
                s.status === "Present"

        ).length;


    if (total === 0) {

        return "0%";

    }


    return Math.round(
        (present / total) * 100
    ) + "%";

}



/* ================= DISPLAY ================= */

function displayAttendance() {

    let list =
        document.getElementById("attendanceList");


    list.innerHTML = "";


    /* No Data */

    if (attendanceData.length === 0) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty-message"
                >

                    No attendance records found.

                </td>

            </tr>

        `;

        return;

    }


    /* Display Records */

    attendanceData.forEach(student => {


        let statusClass = "";


        if (student.status === "Present") {

            statusClass = "present";

        }


        else if (student.status === "Absent") {

            statusClass = "absent";

        }


        else {

            statusClass = "not-marked";

        }


        let percentage =
            getPercentage(
                student.name,
                student.studentClass
            );


        list.innerHTML += `

            <tr>


                <!-- NAME -->

                <td>

                    ${student.name}

                </td>


                <!-- CLASS -->

                <td>

                    ${student.studentClass}

                </td>


                <!-- DATE -->

                <td>

                    ${student.date}

                </td>


                <!-- STATUS -->

                <td class="${statusClass}">

                    ${student.status}

                </td>


                <!-- PRESENT -->

                <td>

                    <button

                        type="button"

                        class="present-btn"

                        onclick="markPresent(${student.id})"

                    >

                        <i class="fas fa-check"></i>

                        Present

                    </button>

                </td>


                <!-- ABSENT -->

                <td>

                    <button

                        type="button"

                        class="absent-btn"

                        onclick="markAbsent(${student.id})"

                    >

                        <i class="fas fa-times"></i>

                        Absent

                    </button>

                </td>


                <!-- PERCENTAGE -->

                <td class="percentage">

                    ${percentage}

                </td>


                <!-- DELETE -->

                <td>

                    <button

                        type="button"

                        class="delete-btn"

                        onclick="deleteStudent(${student.id})"

                    >

                        <i class="fas fa-trash"></i>

                        Delete

                    </button>

                </td>


            </tr>

        `;

    });

}



/* ================= SAVE ================= */

function saveData() {

    localStorage.setItem(

        "neonAttendance",

        JSON.stringify(attendanceData)

    );

}



/* ================= LOAD ================= */

displayAttendance();

</script>


</body>

</html>
